version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-deps:
        patterns:
          - "*"
    ignore:
      # typescript-eslint cannot load the TS 7 compiler API yet, so a TS 7
      # bump turns `bun run lint` into a hard error. Drop this once
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # ships.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gh-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
